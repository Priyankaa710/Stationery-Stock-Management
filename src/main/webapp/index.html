
<!DOCTYPE html>
<html>
<head>
    <title>Stationery Stock Entry</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
        }
        .container {
            width: 350px;
            margin: 40px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }
        h2 { text-align: center; color: #1d3557; }
        label { display: block; margin-top: 12px; }
        input {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        button {
            margin-top: 18px;
            width: 100%;
            padding: 10px;
            background: #1d3557;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>

    <script>
        function validateForm() {
            const qty = Number(document.getElementById("qty").value);
            const rate = Number(document.getElementById("rate").value);
            const level = Number(document.getElementById("level").value);

            if (qty < 0 || rate < 0 || level < 0) {
                alert("Values cannot be negative!");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
<div class="container">
    <h2>Stationery Stock Entry</h2>

    <form action="result.jsp" method="post"
          onsubmit="return validateForm()">

        <label>Item</label>
        <input type="text" name="item" maxlength="40" required>

        <label>Quantity</label>
        <input type="number" id="qty" name="qty"
               min="0" step="1" required>

        <label>Rate (Rs.)</label>
        <input type="number" id="rate" name="rate"
               min="0" step="0.01" required>

        <label>Reorder Level</label>
        <input type="number" id="level" name="reorder_level"
               min="0" step="1" required>

        <button type="submit">Save</button>
    </form>
</div>
</body>
</html>
